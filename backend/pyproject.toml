[project]
name = "etabs-register"
version = "0.1.0"
description = "ETABS model diff engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.uv]
workspace-members = [""]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
