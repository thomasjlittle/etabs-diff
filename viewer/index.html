<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>etabs-diff viewer</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #f4f4f4; color: #222; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 12px; align-items: center;
         padding: 8px 12px; background: #fff; border-bottom: 1px solid #ddd; z-index: 1; flex-wrap: wrap; }
  #legend { margin-left: auto; }
  .gray { color: #888; } .red { color: #d22; font-weight: 600; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
          background: rgba(210, 34, 34, 0.08); border: 3px dashed #d22; font-size: 20px; z-index: 2; }
  body.dragging #drop { display: flex; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <input type="file" id="file" accept=".json,application/json">
  <button id="example">Load example</button>
  <span id="legend" class="gray">Load a diff JSON (file picker or drag and drop)</span>
</div>
<div id="drop">Drop diff JSON here</div>
<script type="module">
// ponytail: all inline so the page works from file:// (Chrome blocks local module imports there)
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const GRAY = new THREE.Color(0x888888), RED = new THREE.Color(0xdd2222);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f4f4);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 1e6);
camera.up.set(0, 0, 1);  // ETABS is Z-up
const controls = new OrbitControls(camera, renderer.domElement);
let model = null;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// One mesh per (kind, changed) bucket keeps draw calls low on large models.
function build(diff) {
  const buckets = { gray: { lines: [], tris: [], pts: [] }, red: { lines: [], tris: [], pts: [] } };
  for (const el of diff.elements) {
    const b = buckets[el.status === 'unchanged' ? 'gray' : 'red'];
    const g = el.geometry;
    if (el.kind === 'frame') b.lines.push(...g[0], ...g[1]);
    else if (el.kind === 'point') b.pts.push(...g[0]);
    // ponytail: fan triangulation, right for convex areas; use THREE.ShapeUtils if L-shaped walls/slabs show up
    else for (let i = 1; i < g.length - 1; i++) b.tris.push(...g[0], ...g[i], ...g[i + 1]);
  }
  const group = new THREE.Group();
  for (const [name, b] of Object.entries(buckets)) {
    const red = name === 'red';
    const color = red ? RED : GRAY;
    const look = { color, transparent: !red, opacity: red ? 1 : 0.3, depthWrite: red };
    const geo = arr => new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    if (b.tris.length) group.add(new THREE.Mesh(geo(b.tris),
      new THREE.MeshBasicMaterial({ ...look, side: THREE.DoubleSide, opacity: red ? 0.6 : 0.12, transparent: true })));
    if (b.lines.length) group.add(new THREE.LineSegments(geo(b.lines), new THREE.LineBasicMaterial(look)));
    if (b.pts.length) group.add(new THREE.Points(geo(b.pts),
      new THREE.PointsMaterial({ ...look, size: red ? 9 : 6, sizeAttenuation: false })));
    if (red) group.children.forEach(o => { o.renderOrder = 1; });  // draw red over the gray ghost
  }
  return group;
}

function show(diff) {
  if (!Array.isArray(diff?.elements)) throw new Error('not an etabs-diff output: no elements array');
  if (model) scene.remove(model);
  model = build(diff);
  scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(1, -1.4, 0.9).multiplyScalar(size * 0.8));
  camera.near = size / 1000; camera.far = size * 100;
  camera.updateProjectionMatrix();
  const n = k => Number(diff.summary?.[k]) || 0;  // Number() so file text never lands in innerHTML
  document.getElementById('legend').innerHTML =
    `<span class="gray">unchanged ${n('unchanged')}</span> | <span class="red">added ${n('added')}, ` +
    `removed ${n('removed')}, modified ${n('modified')}, affected ${n('affected')}</span>`;
}

async function loadFile(file) {
  try { show(JSON.parse(await file.text())); }
  catch (e) { alert(`Could not load ${file.name}: ${e.message}`); }
}

document.getElementById('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
document.getElementById('example').addEventListener('click', async () => {
  try { show(await (await fetch('example-diff.json')).json()); }
  catch {
    // file:// pages cannot fetch neighbors, so fall back to the picker
    alert('Browsers block loading files next to a page opened from disk. Pick example-diff.json in the next dialog, or serve this folder (see README).');
    document.getElementById('file').click();
  }
});
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
